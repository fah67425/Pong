<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pong</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <div id="startscreen">
        <h1>PONG</h1>
        <p>select the difficulties, if you play multiplayer,
           move left paddle with W/S and right paddle with I/K</p>

        <div id="difficultybtn">
            <button id="difficulty1" class="difficulty selected">easy</button>
            <button id="difficulty2" class="difficulty">medium</button>
            <button id="difficulty3" class="difficulty">hard</button>
            <p>or play with a friend!  (mobile didnt support multiplayer :[     )</p>
            <button id="multiplayer" class="difficulty">multiplayer</button>
        </div>
        <button id="playbutton">START -></button>
    </div>

    <div id="gamescreen">
        <div id="gametext">
            <span id="score">0 - 0</span>
            <button id="roundbtn">PAUSE</button>
        </div>
        <canvas id="board"></canvas>
    </div>

    <div id="roundmenu">
        <button id="resumebtn">RESUME</button>
    </div>
    <div id="pausetext">PAUSED</div>
</body>
</html>
