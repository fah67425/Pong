<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pong</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <div>
        <h1>PONG</h1>
        <p>press start to play (NO CHEATING)</p>
        <p>select the difficulties, if you play multiplayer, move left paddle with W/S and right paddle with I/K</p>
        <button id="playbutton">START -></button>
    </div>     

    <div id="menu">
        <h2>GAME MODE</h2>
        <p>choose your difficulty:</p>
        <button id="difficulty1">easy</button>
        <button id="difficulty2">medium</button>
        <button id="difficulty3">hard</button>
        <p>or play with a friend!( mobile play didnt support :[  )</p>
        <button id="multiplayer">multiplayer</button>
    </div>
    <canvas id="board"></canvas>
    <div id="pausetext">PAUSED</div>
</body>
</html>
